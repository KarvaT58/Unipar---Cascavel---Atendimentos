services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: unipar-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_HOST_IP}:7880:7880"
      - "${LIVEKIT_HOST_IP}:7881:7881"
      - "${LIVEKIT_HOST_IP}:40000-40100:40000-40100/udp"
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:40000-40100:40000-40100/udp"
